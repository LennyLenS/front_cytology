version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: front_cytology
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=4096
      # Добавьте ваши переменные окружения здесь
      # - NEXT_PUBLIC_API_BASE_URL=http://your-api-url
      # - NEXT_PUBLIC_API_TOKEN=your-token
    volumes:
      # Монтируем директорию для загрузок (опционально, для персистентности)
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
